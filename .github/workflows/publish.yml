name: Publish

on:
  push:
    tags:
      - "publish-*"

permissions:
  contents: read

jobs:
  verify-source:
    if: startsWith(github.ref, 'refs/tags/publish-')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out release source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.12.0
          package-manager-cache: false

      - name: Verify signed release source
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verify-release-source.mjs

  publish:
    needs: verify-source
    if: startsWith(github.ref, 'refs/tags/publish-')
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.12.0
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false

      - name: Set up npm
        run: npm install -g npm@11.15.0 --ignore-scripts

      - name: Set up pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.0.4 --activate

      - name: Resolve package tag
        id: plan
        shell: bash
        run: |
          node scripts/resolve-publish-tag.mjs "${GITHUB_REF_NAME}" > publish-plan.json
          node -e "const p=require('./publish-plan.json'); console.log('mode=' + p.mode); console.log('verify=' + p.verify); console.log('prepare=' + p.prepare);" >> "$GITHUB_OUTPUT"

      - name: Restore staging checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/restore-stage-receipt.mjs publish-plan.json

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Prepare selected packages
        run: node scripts/run-publish-plan.mjs prepare publish-plan.json

      - name: Verify selected packages
        run: node scripts/run-publish-plan.mjs verify publish-plan.json

      - name: Verify installed entry points start
        run: node scripts/verify-installed-commands.mjs --plan publish-plan.json --json

      - name: Stage selected packages
        run: node scripts/run-publish-plan.mjs stage publish-plan.json
