packages:
  - "adapters/*"
  - "packages/*"
  - "products/aib"
  - "products/aie"
  - "products/aiu"
  - "products/qube"
  - "products/aiq"
  - "products/aiq/packages/*"
  - "plugins/*"

minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - undici@6.27.0
  # First-party QUBE packages from this repository (trusted publishing). Third-party deps still use the age gate.
  - "@tjalve/qube"
  - "@tjalve/qube-cli"
  - "@tjalve/qube-core"
  - "@tjalve/qube-risk-cards"
  - "@tjalve/qube-adapter-github"
  - "@tjalve/qube-adapter-codex"
  - "@tjalve/qube-adapter-opencode"
  - "@tjalve/qube-adapter-claude-code"
  - "@tjalve/qube-adapter-gitlab"
  - "@tjalve/qube-adapter-linear"
  - "@tjalve/qube-adapter-jira"
  - "@tjalve/qube-adapter-jenkins"
  - "@tjalve/aib"
  - "@tjalve/aie"
  - "@tjalve/aiq"
  - "@tjalve/aiu"
minimumReleaseAgeIgnoreMissingTime: false
minimumReleaseAgeStrict: true
trustPolicy: no-downgrade
trustPolicyExclude:
  # Jest still pulls semver@6.3.1 through AIQ's legacy test stack.
  - "semver@6.3.1"
blockExoticSubdeps: true
strictDepBuilds: true
verifyDepsBeforeRun: error
savePrefix: ""
linkWorkspacePackages: true
registries:
  default: https://registry.npmjs.org/

overrides:
  "@babel/core": 7.29.7
  vite@7.3.5>esbuild: 0.28.1
  js-yaml: 4.2.0
  undici: 6.27.0
